spring.application.name=poco

server.address=0.0.0.0
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/poco_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:3567}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# FCM 서비스 계정 키(JSON) 파일의 로컬 경로. 비어있으면 FCM 기능이 자동으로 꺼짐(서버는 정상 실행).
fcm.credentials-path=${FCM_CREDENTIALS_PATH:}