# application.properties에서 사용하는 환경변수 예시입니다.
# Spring Boot가 이 파일을 자동으로 읽지는 않습니다 — 실행 전에 아래 값을
# 실제 셸 환경변수(또는 IDE 실행 설정, Docker/systemd 환경변수)로 export하고,
# 값은 각자 로컬 MySQL 설정에 맞는 실제 값으로 바꿔서 사용하세요.
#
#   export DB_URL="jdbc:mysql://localhost:3306/poco_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul"
#   export DB_USERNAME="poco_user"
#   export DB_PASSWORD="changeme"
#
# FCM(푸시 알림)을 쓰려면 Firebase 콘솔 > 프로젝트 설정 > 서비스 계정에서
# "새 비공개 키 생성"으로 받은 JSON 파일을 로컬 아무 경로에 두고 그 경로를 지정하세요.
# 이 파일은 절대 깃에 올리지 마세요 (이미 .gitignore에 등록되어 있습니다).
#   export FCM_CREDENTIALS_PATH="/Users/본인계정/keys/poco-firebase-key.json"
#
# 값이 없거나 파일을 못 찾으면 서버는 정상 실행되고 FCM 발송 기능만 꺼집니다.

DB_URL=jdbc:mysql://localhost:3306/poco_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
DB_USERNAME=poco_user
DB_PASSWORD=changeme
FCM_CREDENTIALS_PATH=/Users/본인계정/keys/poco-firebase-key.json
